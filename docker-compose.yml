services:
  llm-proxy:
    image: ghcr.io/lu8010252/llm-proxy:latest
    container_name: llm-proxy
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - GATEWAY_KEY=CHANGE_ME
      - ADMIN_KEY=CHANGE_ME
      - CONFIG_PATH=/app/data/config.json   # 首次启动自动生成,到网页「配置」页填 API Key
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data                   # 配置文件在这里(config.json)
      - ./logs:/app/logs
